<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You are offline | Mimshak Pak Investments Ltd.</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo.jpeg">
<style>
:root{--accent:#e8731a;--ink:#1a1613;--ink-2:#4a423b;--muted:#7b7169;--line:#e7e2db;--bg-2:#f7f5f2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink-2);line-height:1.65}
.card{max-width:460px;text-align:center}
.logo{width:64px;height:64px;border-radius:10px;margin:0 auto 1.4rem;display:block}
h1{font-size:1.5rem;color:var(--ink);margin:0 0 .5rem;letter-spacing:-.02em}
p{margin:0 0 1.6rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;
  padding:.85rem 1.6rem;border-radius:6px;border:0;cursor:pointer;font-size:.95rem;font-family:inherit}
.btn:hover{background:#c85f0d}
.reach{margin-top:2rem;padding-top:1.4rem;border-top:1px solid var(--line);font-size:.9rem}
.reach a{color:var(--accent);text-decoration:none;font-weight:600}
.reach div{margin-top:.4rem}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="assets/img/logo.jpeg" alt="Mimshak Pak Investments Ltd.">
  <h1>You are offline</h1>
  <p>We could not load that page because your device has no internet connection right now. Pages you have already visited will still open.</p>
  <button class="btn" onclick="location.reload()">Try again</button>
  <div class="reach">
    You can still reach us directly:
    <div><a href="tel:+2348037079976">0803 707 9976</a> &nbsp;&bull;&nbsp; <a href="tel:+2348103064976">0810 306 4976</a></div>
    <div>No 3 Austin Ugbo Onyeje Avenue, Orjimiyana, Asaba, Delta State</div>
  </div>
</div>
</body>
</html>
